# /etc/nginx/sites-available/mikrotik  — MikroTik Ashgabat (Laravel 13, PHP 8.4-FPM)
server {
    listen 80;
    listen [::]:80;
    server_name demo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.example.com;

    ssl_certificate     /etc/letsencrypt/live/demo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.com/privkey.pem;

    root /var/www/mikrotik/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/uploads/.*\.(php\d?|phtml|phar|pl|py|cgi|sh|html?|svg)$ { deny all; }

    location /build/assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /uploads/      { expires 30d; try_files $uri =404; }
    location /images/       { expires 30d; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.svg { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    location ~ \.php$ { return 404; }
}
